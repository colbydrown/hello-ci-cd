name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Install UV
        run: curl -sSL https://install.urschrei.io/uv | bash

      - name: Run tests
        run: PYTHONPATH=. uv run pytest tests

