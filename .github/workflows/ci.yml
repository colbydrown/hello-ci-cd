name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Download and install UV
      - name: Install UV
        run: curl -sSf https://install.urschrei.dev/uv.sh | sh

      # Step 3: Run the unit tests using UV
      - name: Run tests
        run: PYTHONPATH=. uv run pytest tests

