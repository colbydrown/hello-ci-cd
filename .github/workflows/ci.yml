name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install UV
        uses: astral/uv-action@v0.3.3

      - name: Run tests
        run: uv run pytest tests

