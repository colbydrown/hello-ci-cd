name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install UV
        run: |
          curl -sSfL https://raw.githubusercontent.com/urschrei/uv/main/install.sh | bash
          export PATH="$HOME/.local/bin:$PATH"
          uv --version  # optional, just to check installation

      - name: Run tests with UV
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          PYTHONPATH=. uv run pytest tests


