name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install UV
        uses: urschrei/uv-action@v1

      - name: Run tests
        run: |
          PYTHONPATH=. uv run pytest tests

