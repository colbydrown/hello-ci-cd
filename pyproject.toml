[project]
name = "hello-ci-cd"
version = "0.1.0"
description = "A small project for CI/CD testing"
readme = "README.md"
requires-python = ">=3.13"

[build-system]
requires = ["uv"]
build-backend = "uv.build"

[tool.uv]
python-preference = "only-managed"

[tool.uv.extra-build-dependencies]
hello-ci-cd = ["pytest"]
